name: sp-ui-vault CI

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: sp-ui-vault-${{ github.ref }}
    cancel-in-progress: true

permissions: read-all

jobs:
    build-test:
        name: Build + Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Checkout sp-ui-core
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  repository: personal-digital-sovereignty/sp-ui-core
                  ref: main
                  path: sp-ui-core

            - name: Link sp-ui-core
              run: ln -s "$(pwd)/sp-ui-core" ../sp-ui-core

            - uses: actions/setup-node@3963e1d654f8c27140a08709ec7944151b4cc521 # v4.1.0
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm install
            - run: npm run check || true
            - run: npm test
            - run: npm run build
